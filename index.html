<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Philip Yang</title>
  <meta name="description" content="Yupeng (Philip) Yang, Vanderbilt University. Law, markets, and the machines changing both.">
  <meta property="og:title" content="Philip Yang">
  <meta property="og:description" content="Law, markets, and the machines changing both.">
  <meta name="theme-color" content="#f5f7fc">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <canvas id="dots" aria-hidden="true"></canvas>
  <a class="skip" href="#projects">Skip to projects</a>

  <header class="nav">
    <a class="mark" href="#top" aria-label="Back to top" data-bind="shortName"></a>
    <nav id="menu" aria-label="Sections">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#research">Research</a>
      <a href="#leadership">Leadership</a>
      <a href="#honors">Honors</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="nav-tools">
      <button class="theme" type="button" aria-label="Switch color theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7a5 5 0 0 1 0 10z" fill="currentColor"/></svg>
      </button>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-copy">
        <p class="hero-school" data-bind="school"></p>
        <h1 data-bind="headline"></h1>
        <p class="hero-intro" data-bind="intro"></p>
        <div class="actions">
          <a class="btn btn-solid" href="#projects">See my projects</a>
          <a class="btn" data-bind-href="email:mailto">Email me</a>
        </div>
      </div>
      <figure class="graph" aria-label="Map of how my work connects to my interests">
        <canvas id="graph"></canvas>
        <figcaption>How my work connects. Hover a dot, or click one to jump to it.</figcaption>
      </figure>
    </section>

    <section id="about" class="about" aria-labelledby="about-h">
      <h2 id="about-h" class="h2">About</h2>
      <div class="about-grid">
        <div class="bio" id="bio"></div>
        <aside class="about-side">
          <dl id="facts" class="facts"></dl>
          <div class="now">
            <h3>Now</h3>
            <ul id="now-list"></ul>
            <p class="mono muted">Updated <span data-bind="nowUpdated"></span></p>
          </div>
        </aside>
      </div>
    </section>

    <section id="projects" class="work" aria-labelledby="projects-h">
      <h2 id="projects-h" class="h2">Projects</h2>
      <div id="featured"></div>
      <div id="project-grid" class="projects"></div>
    </section>

    <section id="research" aria-labelledby="research-h">
      <h2 id="research-h" class="h2">Research</h2>
      <ol id="research-list" class="research"></ol>
    </section>

    <section id="leadership" class="leadership" aria-labelledby="lead-h">
      <h2 id="lead-h" class="h2">Leadership</h2>
      <ol id="timeline" class="timeline"></ol>
    </section>

    <section id="honors" class="honors" aria-labelledby="honors-h">
      <h2 id="honors-h" class="h2">Honors</h2>
      <div id="honor-groups" class="honor-groups"></div>
    </section>

    <section id="contact" class="contact" aria-labelledby="contact-h">
      <h2 id="contact-h" data-bind="contactLine"></h2>
      <a class="email" data-bind="email" data-bind-href="email:mailto"></a>
      <ul id="links" class="links"></ul>
    </section>
  </main>

  <footer class="foot">
    <span>© <span id="year"></span> <span data-bind="shortName"></span></span>
    <a href="#top">Back to top</a>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
